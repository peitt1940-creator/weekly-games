<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>每週遊戲原型</title>
<style>
:root{--bg:#eef2e2;--card:#fff;--ink:#22302a;--ink2:#5a6a5f;--line:#22302a;--mon:#4f7a3a;--wed:#3c7fa6;--fri:#b8573a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;line-height:1.6}
main{max-width:760px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:28px;margin:0 0 4px}
.sub{color:var(--ink2);margin:0 0 24px}
.g{display:block;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0;text-decoration:none;color:inherit;box-shadow:0 3px 0 var(--line)}
.g:hover{transform:translateY(-1px)}
.g:focus-visible{outline:3px solid var(--wed);outline-offset:2px}
.tag{display:inline-block;font-size:13px;color:#fff;border-radius:10px;padding:0 8px;margin-right:8px}
.mon{background:var(--mon)}.wed{background:var(--wed)}.fri{background:var(--fri)}
.t{font-size:19px;font-weight:700}
.d{font-size:15px;color:var(--ink2);margin-top:2px}
.date{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
footer{font-size:12px;color:var(--ink2);margin-top:32px}
</style>
</head>
<body>
<main>
<h1>每週遊戲原型</h1>
<p class="sub">週一 RPG／週三合作／週五熱門玩法改編</p>
<!-- GAMES:START 新遊戲加在這一行下面，最新的放最上面 -->
<a class="g" href="./element-lab/"><span class="tag fri">週五熱門</span><span class="date">2026-11-13</span><div class="t">小小元素實驗室</div><div class="d">先猜再實驗：在實驗箱裡畫出沙、水、火、冰、鹽，用元素反應完成五個任務。</div></a>
<a class="g" href="https://peitt1940-creator.github.io/windup-robot-er/"><span class="tag wed">週三合作</span><span class="date">2026-11-11</span><div class="t">發條機器人急診室</div><div class="d">2–4 人：修理員看機器、工程師看手冊，只能用說的把機器人修好。</div></a>
<a class="g" href="https://peitt1940-creator.github.io/sunflower-inquiry/"><span class="tag mon">週一RPG</span><span class="date">2026-11-09</span><div class="t">向日葵的問號</div><div class="d">在校園裡問人、摸土、做實驗，找出東邊向日葵長比較高的原因。</div></a>
<!-- GAMES:END -->
<footer>本遊戲由Peiching開發，角色與情境均為虛構</footer>
</main>
</body>
</html>
