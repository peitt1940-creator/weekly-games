<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>一起歪一點</title>
<style>
/* 一起歪一點・連線版：老師電腦開網頁＝房間主機；學生掃 QR code 用自己的裝置加入，只拿到自己方向的按鈕。 */
:root{--felt:#163a35;--felt2:#0f2b27;--ink:#f4efe4;--dim:#b9c9c2;--card:#fbf6ec;--cink:#2b2118;--cdim:#6d5c4b;--line:#e3d5bf;--wood:#8a5a2b;--warn:#ff6b5a;
--f:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;--fd:"Chiron GoRound TC","jf-openhuninn","Yuanti TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(circle at 50% 30%,var(--felt),var(--felt2)) fixed;color:var(--ink);font-family:var(--f);-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--fd);margin:0;text-wrap:balance}
.wrap{max-width:1200px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
.btn{border:none;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--card);color:var(--cink)}
.btn.dark{background:#2b2118;color:#fbf6ec}.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px #ffffff55}
.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);color:var(--cink);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.card p{margin:0;line-height:1.65}
.eyebrow{font-size:12px;letter-spacing:.12em;font-weight:700;color:var(--cdim)}
.sig{font-size:12px;color:var(--dim)}.card .sig{color:var(--cdim)}
.talk{border-left:4px solid var(--wood);padding:2px 0 2px 12px;line-height:1.65}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}th,td{border-bottom:1px solid var(--line);padding:5px 4px;text-align:center}th{color:var(--cdim);font-weight:600}
.bars{display:flex;flex-direction:column;gap:6px}.bar{display:grid;grid-template-columns:72px 1fr 52px;gap:8px;align-items:center;font-size:14px}
.bar .t{height:12px;border-radius:6px;background:#eadfcd;overflow:hidden}.bar .t i{display:block;height:100%}
ul.q{margin:0;padding-left:20px;line-height:1.8}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:14px;font-weight:700;background:#ffffff14}
.chip.off{opacity:.45}.chip .dotc{width:10px;height:10px;border-radius:50%}
canvas.board{display:block;width:100%;aspect-ratio:1;border-radius:12px;box-shadow:0 12px 30px #0007;max-width:100%}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);background:#000d;color:#fff;padding:8px 14px;border-radius:20px;font-size:15px;z-index:50;pointer-events:none;opacity:0;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.net{font-size:14px;color:var(--dim)}.net b{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.rcard{background:#0b1d1a;border:1px solid #ffffff22;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.rcard h3{font-size:26px;letter-spacing:.12em}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.focus{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.focus .side{display:flex;flex-direction:column;gap:12px}
#bigBoard{width:min(100%,calc(100vh - 40px));margin:0 auto}
.qr{background:#fff;border-radius:12px;padding:6px;width:100%;max-width:240px;line-height:0}
.qr svg{display:block;width:100%;height:auto}
.code{font-family:var(--fd);font-size:56px;letter-spacing:.18em;line-height:1}
.stat{font-size:15px;color:var(--dim)}.stat b{color:var(--ink);font-size:22px;font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--dim);line-height:1.6}
@media (max-width:900px){.focus{grid-template-columns:1fr}}
.student .wrap{max-width:560px}
body.student,body.student *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.student{touch-action:manipulation;overscroll-behavior:none}
.hold *{pointer-events:none}
.seatbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:none;border-radius:14px;padding:14px;background:#ffffff12;color:var(--ink);font-size:17px;font-weight:700}
.seatbtn .big{font-size:28px}.seatbtn:disabled{opacity:.45}
.me{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700}
.pads{display:grid;gap:12px;margin-top:12px}
.hold{position:relative;border:none;border-radius:20px;min-height:120px;color:#fff;font-size:24px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  background:color-mix(in srgb,var(--c) 35%,#0d1f1c);box-shadow:inset 0 0 0 3px var(--c);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.hold.on{background:var(--c);box-shadow:inset 0 0 0 4px #fff,0 0 24px var(--c)}
.hold.tired{opacity:.45}.hold small{font-size:14px;font-weight:600;opacity:.9}
.hold .sta{position:absolute;left:14px;right:14px;bottom:10px;height:6px;border-radius:3px;background:#ffffff33}.hold .sta i{display:block;height:100%;border-radius:3px;background:#fff}
.mini{max-width:300px;margin:0 auto;width:72%}
.status{display:flex;justify-content:space-between;font-size:14px;color:var(--dim);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="app"><div class="wrap"><p>載入中…</p></div></div>
<div id="toast"></div>
<script>
// 載入連線元件（PeerJS 1.5.4）與 QR code 元件（qrcode-generator 1.4.4），第一個網址失敗就換下一個
function loadAny(urls,cb){var i=0;(function next(){if(i>=urls.length){cb(false);return;}var s=document.createElement('script');s.src=urls[i++];s.onload=function(){cb(true);};s.onerror=function(){s.remove();next();};document.head.appendChild(s);})();}
var LIBS_OK=0;
loadAny(['https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js','https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'],function(ok){LIBS_OK+=ok?1:100;window.startApp&&window.startApp();});
loadAny(['https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js','https://unpkg.com/qrcode-generator@1.4.4/qrcode.js'],function(ok){LIBS_OK+=ok?1:100;window.startApp&&window.startApp();});
</script>
<script>
(function(){
"use strict";
/* ================= 遊戲資料 ================= */
const DIRS=['N','E','S','W'],DV={N:[0,-1],E:[1,0],S:[0,1],W:[-1,0]},DNAME={N:'北',E:'東',S:'南',W:'西'},ARROW={N:'⬆',E:'➡',S:'⬇',W:'⬅'};
const SEATS={2:{N:1,E:1,S:2,W:2},3:{N:1,E:2,S:3,W:3},4:{N:1,E:2,S:3,W:4}};
const PL=[null,{icon:'🐦',name:'1號',hex:'#3b9cff'},{icon:'🦊',name:'2號',hex:'#ff9440'},{icon:'🐢',name:'3號',hex:'#2ecf8c'},{icon:'🐙',name:'4號',hex:'#b48cff'}];
const LEVELS=[
 {name:'熱身：會滾的彈珠',start:[14,14],goal:[84,84,7],walls:[[42,40,16,20]],holes:[],rivers:[],
  tip:'按住自己的按鈕，木盤就往那一邊低下去，彈珠會往那邊滾。先試試看，再把彈珠送進右下角的家。',
  talk:'剛剛是誰先發現彈珠快撞牆了？下一關要不要先約好一個「停」的暗號？'},
 {name:'S 形小路',start:[12,12],goal:[86,86,7],walls:[[0,30,72,5],[28,62,72,5]],holes:[],rivers:[],
  tip:'路會轉兩個彎。轉彎前要先讓彈珠慢下來，慢下來要靠「對面」的人幫忙。',
  talk:'轉彎的時候，是誰說要換方向？大家是同時想到，還是有人先開口？'},
 {name:'洞洞路',start:[10,50],goal:[90,50,6],walls:[[0,0,100,22],[0,78,100,22]],holes:[[30,40,6],[30,62,6],[50,50,6],[70,36,6],[70,64,6]],rivers:[],
  tip:'路上有五個洞，掉下去就要回到起點。太快會來不及轉，太慢又會卡住。',
  talkFall:'這關掉下去 {n} 次。是太快了，還是有人往錯的方向按？那時候大家說了什麼？',
  talk:'一次都沒掉！你們是怎麼控制速度的？是誰在注意洞的位置？'},
 {name:'停穩打卡',start:[50,90],goal:[22,22,6],walls:[[38,38,24,24]],holes:[[50,12,5],[12,50,5]],rivers:[],checkpoints:[[22,78],[78,78],[78,22]],
  tip:'依照 1 → 2 → 3 的順序，讓彈珠在每個打卡圈裡「停住」一秒。三個都打卡，家門才會打開。',
  talk:'要停在打卡圈裡，一個人辦得到嗎？剛剛是誰負責「踩煞車」？'},
 {name:'大風吹',start:[12,88],goal:[14,12,7],walls:[[0,48,70,5],[30,23,58,5]],holes:[],rivers:[[88,0,12,100]],wind:[22,0],
  tip:'風一直往東吹，右邊是小河。西邊的人要一直頂住，可是按太久會沒力（按鈕上的力氣條）。沒力的時候要說出來，大家一起找地方停一下。',talk:''}
];
const R=2.6,ACC=55,DAMP=1.4,VMAX=45,DRAIN=9,RECOVER=22,WAKE=35,TOTAL=720,EXTRA=240,HOLD_MS=900;
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const Q=new URLSearchParams(location.search);
function peerOptions(){const o={debug:1};if(Q.get('peerhost')){o.host=Q.get('peerhost');o.port=+Q.get('peerport')||9000;o.path='/';o.secure=false;o.config={iceServers:[]};}return o;}
function dirsOf(players,seat){return DIRS.filter(d=>SEATS[players][d]===seat);}
function seatText(players,seat){return dirsOf(players,seat).map(d=>DNAME[d]+'邊').join('＋');}
function rid(n,chars){let s='';const a=new Uint32Array(n);crypto.getRandomValues(a);for(let i=0;i<n;i++)s+=chars[a[i]%chars.length];return s;}
function qrSvg(text){try{const q=qrcode(0,'L');q.addData(text);q.make();return q.createSvgTag({cellSize:8,margin:2,scalable:true});}catch(_){return '<p style="color:#000;line-height:1.4;padding:8px">QR code 元件沒有載入，請輸入下方網址</p>';}}
let toastId=0,toastT=0;
function showToast(t){if(!t||t.id===toastId)return;const first=toastId===0;toastId=t.id;if(first||!t.msg)return;flash(t.msg);}
function flash(m){const el=$('#toast');el.textContent=m;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2000);}

/* ================= 房間主機（只在老師電腦執行） ================= */
const rooms=new Map();
function seatsOf(r){return Array.from({length:r.players},(_,i)=>i+1);}
function seatOfToken(r,tok){for(const s of seatsOf(r))if(tok&&r.seatOwner[s]===tok)return s;return 0;}
function newLvStat(){return {time:0,falls:0,tugs:0,bumps:0,exhausts:0};}
function resetSta(r){DIRS.forEach(d=>{r.sta[d]=100;r.tired[d]=false;r.holdUntil[d]=0;});}
function createRoom(players){let code;do{code=rid(4,'ABCDEFGHJKLMNPQRSTUVWXYZ');}while(rooms.has(code));
  const r={code,players,seatOwner:{},clients:new Set(),phase:'lobby',level:0,timeLeft:TOTAL,retries:0,ball:{x:0,y:0,vx:0,vy:0},holdUntil:{},sta:{},tired:{},cpIndex:0,cpTimer:0,spawn:[0,0],falling:0,
    lvStat:newLvStat(),stats:[],holdSec:{1:0,2:0,3:0,4:0},tugCur:{NS:0,EW:0},tugCounted:{NS:false,EW:false},exhausts:0,fallTotal:0,windT:0,toast:{id:0,msg:''}};
  resetSta(r);rooms.set(code,r);return r;}
function toastR(r,m){r.toast={id:r.toast.id+1,msg:m};}
function setupLevel(r){const L=LEVELS[r.level];r.ball={x:L.start[0],y:L.start[1],vx:0,vy:0};r.spawn=L.start.slice();r.cpIndex=0;r.cpTimer=0;r.falling=0;r.lvStat=newLvStat();r.tugCur={NS:0,EW:0};r.tugCounted={NS:false,EW:false};resetSta(r);}
function resetGame(r){r.level=0;r.timeLeft=TOTAL;r.retries=0;r.stats=[];r.fallTotal=0;r.exhausts=0;r.holdSec={1:0,2:0,3:0,4:0};}
function allSeated(r){return seatsOf(r).every(s=>r.seatOwner[s]);}
function isOn(r,d,now){return now<r.holdUntil[d];}
function active(r,d,now){return isOn(r,d,now)&&!r.tired[d];}
function wallsOf(L){return L.walls.concat([[-10,-10,120,10],[-10,100,120,10],[-10,0,10,100],[100,0,10,100]]);}
function physStep(r,dt,now){
  const L=LEVELS[r.level],b=r.ball;
  DIRS.forEach(d=>{if(isOn(r,d,now)&&!r.tired[d]){r.sta[d]-=DRAIN*dt;if(r.sta[d]<=0){r.sta[d]=0;r.tired[d]=true;r.exhausts++;r.lvStat.exhausts++;toastR(r,SEATS[r.players][d]+'號（'+DNAME[d]+'）沒力了，先放開休息一下');}}
    else{r.sta[d]=Math.min(100,r.sta[d]+RECOVER*dt);if(r.tired[d]&&r.sta[d]>=WAKE)r.tired[d]=false;}});
  const counted={};DIRS.forEach(d=>{if(active(r,d,now))counted[SEATS[r.players][d]]=true;});Object.keys(counted).forEach(p=>r.holdSec[p]+=dt);
  [['NS','N','S'],['EW','E','W']].forEach(([k,a,c])=>{if(active(r,a,now)&&active(r,c,now)){r.tugCur[k]+=dt;if(r.tugCur[k]>.3&&!r.tugCounted[k]){r.tugCounted[k]=true;r.lvStat.tugs++;toastR(r,'兩邊同時按，彈珠被拉來拉去！');}}else{r.tugCur[k]=0;r.tugCounted[k]=false;}});
  if(r.falling>0){r.falling-=dt;if(r.falling<=0){r.falling=0;r.ball={x:r.spawn[0],y:r.spawn[1],vx:0,vy:0};}return;}
  let ax=0,ay=0;DIRS.forEach(d=>{if(active(r,d,now)){ax+=DV[d][0]*ACC;ay+=DV[d][1]*ACC;}});if(L.wind){ax+=L.wind[0];ay+=L.wind[1];}
  b.vx+=ax*dt;b.vy+=ay*dt;const k=Math.exp(-DAMP*dt);b.vx*=k;b.vy*=k;const sp=Math.hypot(b.vx,b.vy);if(sp>VMAX){b.vx*=VMAX/sp;b.vy*=VMAX/sp;}
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  for(const w of wallsOf(L)){const nx=Math.max(w[0],Math.min(b.x,w[0]+w[2])),ny=Math.max(w[1],Math.min(b.y,w[1]+w[3]));let dx=b.x-nx,dy=b.y-ny,dist=Math.hypot(dx,dy);
    if(dist<R){if(dist<1e-6){dx=0;dy=-1;dist=1;}const ux=dx/dist,uy=dy/dist;b.x=nx+ux*R;b.y=ny+uy*R;const vn=b.vx*ux+b.vy*uy;if(vn<0){if(vn<-12)r.lvStat.bumps++;b.vx-=1.35*vn*ux;b.vy-=1.35*vn*uy;}}}
  let fell=false;for(const h of L.holes)if(Math.hypot(b.x-h[0],b.y-h[1])<h[2])fell=true;for(const v of L.rivers)if(b.x>v[0]&&b.x<v[0]+v[2]&&b.y>v[1]&&b.y<v[1]+v[3])fell=true;
  if(fell){r.falling=.7;r.lvStat.falls++;r.fallTotal++;b.vx=b.vy=0;toastR(r,'掉下去了，回到'+(r.cpIndex>0?'上一個打卡點':'起點'));return;}
  if(L.checkpoints&&r.cpIndex<L.checkpoints.length){const c=L.checkpoints[r.cpIndex];
    if(Math.hypot(b.x-c[0],b.y-c[1])<5&&Math.hypot(b.vx,b.vy)<7){r.cpTimer+=dt;if(r.cpTimer>=1){r.cpIndex++;r.cpTimer=0;r.spawn=[c[0],c[1]];toastR(r,r.cpIndex<L.checkpoints.length?'打卡 '+r.cpIndex+' 完成！':'三個都打卡了，家門打開！');}}
    else r.cpTimer=Math.max(0,r.cpTimer-dt*2);}
  const locked=L.checkpoints&&r.cpIndex<L.checkpoints.length;
  if(!locked&&Math.hypot(b.x-L.goal[0],b.y-L.goal[1])<L.goal[2]-1){r.stats[r.level]=r.lvStat;resetSta(r);r.phase=r.level===LEVELS.length-1?'endA':'clear';}
}
function tick(r,dt,now){if(r.phase!=='play')return;r.timeLeft-=dt;r.lvStat.time+=dt;r.windT+=dt;
  if(r.timeLeft<=0){r.timeLeft=0;r.stats[r.level]=r.lvStat;resetSta(r);r.phase='endB';return;}physStep(r,dt,now);}
function doAction(r,action,who){const ph=r.phase;if(!who.teacher&&!who.seat)return '請先選號碼';
  switch(action){
    case 'start':if(ph!=='lobby')return 'ok';if(!allSeated(r))return '還有號碼沒有人選';resetGame(r);setupLevel(r);r.phase='card';break;
    case 'go':if(ph==='card'){setupLevel(r);r.phase='play';}break;
    case 'next':if(ph==='clear'){r.level++;setupLevel(r);r.phase='card';}break;
    case 'pause':if(ph==='play'){resetSta(r);r.phase='paused';}break;
    case 'resume':if(ph==='paused')r.phase='play';break;
    case 'redo':if(ph==='paused'||ph==='play'){setupLevel(r);r.phase='card';}break;
    case 'retry':if(ph==='endB'){r.timeLeft=EXTRA;r.retries++;setupLevel(r);r.phase='card';}break;
    case 'again':if(ph==='endA'||ph==='endB'){resetGame(r);r.phase='lobby';}break;
    default:return '不認得的動作';}
  return 'ok';}
const r2=v=>Math.round(v*100)/100;
function snapshot(r,now){const seats={};seatsOf(r).forEach(s=>{const tok=r.seatOwner[s];let online=false;if(tok)for(const c of r.clients)if(c.token===tok&&c.conn.open&&now-(c.lastSeen||0)<5000)online=true;seats[s]={taken:!!tok,online};});
  const act={},on={};DIRS.forEach(d=>{act[d]=r.phase==='play'&&active(r,d,now);on[d]=r.phase==='play'&&isOn(r,d,now);});
  return {code:r.code,players:r.players,phase:r.phase,level:r.level,timeLeft:Math.ceil(r.timeLeft),retries:r.retries,ball:{x:r2(r.ball.x),y:r2(r.ball.y)},falling:r2(r.falling),cpIndex:r.cpIndex,cpTimer:r2(r.cpTimer),
    sta:Object.fromEntries(DIRS.map(d=>[d,Math.round(r.sta[d])])),tired:Object.assign({},r.tired),act,on,seats,
    lvStat:{time:Math.round(r.lvStat.time),falls:r.lvStat.falls,tugs:r.lvStat.tugs,exhausts:r.lvStat.exhausts},
    stats:r.stats.map(s=>s&&{time:Math.round(s.time),falls:s.falls,tugs:s.tugs,exhausts:s.exhausts}),
    holdSec:Object.fromEntries(Object.entries(r.holdSec).map(([k,v])=>[k,Math.round(v)])),fallTotal:r.fallTotal,exhausts:r.exhausts,windT:r2(r.windT),toast:r.toast};}
// 學生傳來的訊息
function onStudentMsg(conn,info,m){
  if(!m||typeof m!=='object')return;
  const r=rooms.get(String(m.room||'').toUpperCase());
  const reply=o=>{try{conn.send(Object.assign({re:m.id},o));}catch(_){}};
  if(!r){reply({gone:1});return;}
  if(m.t==='ping')return;
  if(m.t==='hello'){if(info.room&&info.room!==r)info.room.clients.delete(info);info.room=r;r.clients.add(info);reply({ok:1});return;}
  const tok=info.token;
  if(m.t==='join'){const s=+m.seat;if(!seatsOf(r).includes(s))return reply({error:'沒有這個號碼'});const mine=seatOfToken(r,tok);
    if(mine&&mine!==s)return reply({error:'這台裝置已經是 '+mine+' 號了，一台裝置只能選一個號碼'});
    if(r.seatOwner[s]&&r.seatOwner[s]!==tok)return reply({error:s+' 號已經有人選了，請選別的號碼'});
    r.seatOwner[s]=tok;return reply({seat:s});}
  if(m.t==='press'){const s=seatOfToken(r,tok),d=m.dir;if(!s)return reply({error:'你還沒有選號碼'});if(!dirsOf(r.players,s).includes(d))return reply({error:'這不是你的按鈕'});
    if(r.phase!=='play'){r.holdUntil[d]=0;return;}r.holdUntil[d]=m.on?Date.now()+HOLD_MS:0;return;}

}
let hostTimer=0;
function startHostLoop(onFrame){let last=performance.now(),acc=0,sendAcc=0;

    while(acc>=1/120){for(const r of rooms.values())tick(r,1/120,now);acc-=1/120;}
    if(sendAcc>=.05){sendAcc=0;const snaps=[];
      for(const r of rooms.values()){const s=snapshot(r,now);snaps.push(s);
        for(const c of r.clients){if(!c.conn.open)continue;try{c.conn.send({me:seatOfToken(r,c.token),s});}catch(_){}}}

  },1000/60);}

/* ================= 畫木盤與卡片（共用） ================= */
const grain=[];(function(){let s=7;const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647;};for(let i=0;i<46;i++)grain.push([rnd()*100,rnd()*.8+.2,rnd()*6+2,rnd()]);})();
function fit(cv){const rc=cv.getBoundingClientRect();const dpr=Math.min(2,window.devicePixelRatio||1);const w=Math.max(50,Math.round(rc.width*dpr));if(cv.width!==w){cv.width=w;cv.height=w;}const ctx=cv.getContext('2d');ctx.setTransform(w/100,0,0,w/100,0,0);return ctx;}
function drawBoard(cv,s){const ctx=fit(cv);const L=LEVELS[Math.min(s.level,LEVELS.length-1)];
  const g=ctx.createLinearGradient(0,0,100,100);g.addColorStop(0,'#e4b679');g.addColorStop(1,'#c98f4f');ctx.fillStyle=g;ctx.fillRect(0,0,100,100);
  ctx.strokeStyle='rgba(120,70,30,.18)';ctx.lineWidth=.3;for(const [y,a,amp,ph] of grain){ctx.beginPath();for(let x=0;x<=100;x+=4){const yy=y+Math.sin(x/amp+ph*6)*a;x?ctx.lineTo(x,yy):ctx.moveTo(x,yy);}ctx.stroke();}
  for(const v of L.rivers){ctx.fillStyle='#2f7fb3';ctx.fillRect(v[0],v[1],v[2],v[3]);ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=.5;for(let y=4;y<100;y+=8){ctx.beginPath();const o=(s.windT*6)%8;ctx.moveTo(v[0]+2,y+o-4);ctx.quadraticCurveTo(v[0]+v[2]/2,y+o-6,v[0]+v[2]-2,y+o-4);ctx.stroke();}}
  for(const h of L.holes){const hg=ctx.createRadialGradient(h[0],h[1],0,h[0],h[1],h[2]);hg.addColorStop(0,'#000');hg.addColorStop(.75,'#1b0f06');hg.addColorStop(1,'#5a3615');ctx.fillStyle=hg;ctx.beginPath();ctx.arc(h[0],h[1],h[2],0,7);ctx.fill();}
  for(const w of L.walls){ctx.fillStyle='#6b4220';ctx.fillRect(w[0],w[1],w[2],w[3]);ctx.fillStyle='rgba(255,220,170,.35)';ctx.fillRect(w[0],w[1],w[2],.8);}
  ctx.strokeStyle='#6b4220';ctx.lineWidth=2;ctx.strokeRect(1,1,98,98);
  if(L.checkpoints)L.checkpoints.forEach((c,i)=>{const done=i<s.cpIndex,cur=i===s.cpIndex;ctx.lineWidth=1;ctx.strokeStyle=done?'#2e8b57':cur?'#fff':'rgba(255,255,255,.5)';ctx.setLineDash(cur||done?[]:[1.5,1.5]);ctx.beginPath();ctx.arc(c[0],c[1],5,0,7);ctx.stroke();ctx.setLineDash([]);
    if(cur&&s.cpTimer>0){ctx.strokeStyle='#2ecf8c';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(c[0],c[1],6.4,-Math.PI/2,-Math.PI/2+s.cpTimer*Math.PI*2);ctx.stroke();}
    ctx.fillStyle=done?'#2e8b57':'#3a2412';ctx.font='bold 4.6px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(done?'✓':String(i+1),c[0],c[1]+.3);});
  const locked=L.checkpoints&&s.cpIndex<L.checkpoints.length;const [gx,gy,gr]=L.goal;ctx.fillStyle=locked?'rgba(60,60,60,.35)':'rgba(46,207,140,.35)';ctx.beginPath();ctx.arc(gx,gy,gr,0,7);ctx.fill();ctx.strokeStyle=locked?'#555':'#1f9e69';ctx.lineWidth=1;ctx.stroke();
  ctx.font=(gr*1.1)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(locked?'🔒':'🏠',gx,gy+.4);
  if(L.wind){ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=.5;for(let i=0;i<9;i++){const y=6+i*11,x=((s.windT*30+i*37)%110)-10;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+7,y);ctx.stroke();}}
  DIRS.forEach(d=>{if(!s.act||!s.act[d])return;ctx.fillStyle=PL[SEATS[s.players][d]].hex;if(d==='N')ctx.fillRect(0,0,100,1.6);if(d==='S')ctx.fillRect(0,98.4,100,1.6);if(d==='W')ctx.fillRect(0,0,1.6,100);if(d==='E')ctx.fillRect(98.4,0,1.6,100);});
  const b=s.ball;let rr=R;if(s.falling>0)rr=R*s.falling/.7;
  if(rr>.1&&s.phase!=='lobby'){ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.arc(b.x+.7,b.y+.9,rr,0,7);ctx.fill();const bg=ctx.createRadialGradient(b.x-rr*.4,b.y-rr*.4,rr*.1,b.x,b.y,rr);bg.addColorStop(0,'#fff');bg.addColorStop(.35,'#9fe3ff');bg.addColorStop(1,'#1d6fa5');ctx.fillStyle=bg;ctx.beginPath();ctx.arc(b.x,b.y,rr,0,7);ctx.fill();}
}
function tilt(s){let tx=0,ty=0;DIRS.forEach(d=>{if(s.act&&s.act[d]){tx+=DV[d][0];ty+=DV[d][1];}});return 'perspective(900px) rotateX('+(-ty*5)+'deg) rotateY('+(tx*5)+'deg)';}
function talkOf(lv,st){const L=LEVELS[lv];return (L.talkFall&&st&&st.falls>0)?L.talkFall.replace('{n}',st.falls):L.talk;}
function statTable(s){return '<div style="overflow-x:auto"><table><tr><th>關卡</th><th>秒</th><th>掉落</th><th>拔河</th><th>沒力</th></tr>'+s.stats.map((x,i)=>x?'<tr><td>'+(i+1)+'. '+LEVELS[i].name+'</td><td>'+x.time+'</td><td>'+x.falls+'</td><td>'+x.tugs+'</td><td>'+x.exhausts+'</td></tr>':'').join('')+'</table></div>';}
function holdBars(s){const ids=Array.from({length:s.players},(_,i)=>i+1);const mx=Math.max(1,...ids.map(i=>s.holdSec[i]||0));
  return '<div class="bars">'+ids.map(i=>'<div class="bar"><span>'+PL[i].icon+' '+PL[i].name+'</span><span class="t"><i style="width:'+((s.holdSec[i]||0)/mx*100)+'%;background:'+PL[i].hex+'"></i></span><span>'+(s.holdSec[i]||0)+' 秒</span></div>').join('')+'</div>';}
function feedback(s){const out=[];const tugs=s.stats.reduce((a,x)=>a+(x?x.tugs:0),0);const per=s.stats.map((x,i)=>[i,x?x.tugs:0]).sort((a,b)=>b[1]-a[1])[0];
  if(tugs>=5)out.push('這一路有 '+tugs+' 次兩邊同時按，最多的是「'+LEVELS[per[0]].name+'」。回想一下，那時候大家各自在想什麼？');
  else if(tugs>0)out.push('兩邊同時按的情況只有 '+tugs+' 次，你們大概有先講好誰先動、誰等一下。');else out.push('一次拔河都沒有，你們是怎麼分好誰先按的？');
  const ps=Array.from({length:s.players},(_,i)=>[i+1,s.holdSec[i+1]||0]).sort((a,b)=>b[1]-a[1]);const hi=ps[0],lo=ps[ps.length-1];
  if(s.players>2&&hi[1]>lo[1]*2+3)out.push(PL[hi[0]].name+'按得最久，'+PL[lo[0]].name+'按得最少。按得少不一定是沒幫上忙，可能是一直在等時機，也可能是沒有機會說話，可以直接問本人。');
  else if(s.players===2&&hi[1]>lo[1]*2+3)out.push(PL[hi[0]].name+'按的時間是'+PL[lo[0]].name+'的兩倍多。路線本來就偏某些方向，還是有人比較常主動？');else out.push('每個人按的時間差不多，工作分得滿平均。');
  if(s.exhausts>0)out.push('有 '+s.exhausts+' 次有人按到沒力。沒力的那一刻，你有說出來嗎？隊友是怎麼知道的？');return out.map(t=>'<p>'+t+'</p>').join('');}
const DISCUSS='<ul class="q"><li>哪一關你們最常同時說話？後來是怎麼決定誰先說的？</li><li>有沒有哪一刻，你很想直接幫別人按？你後來怎麼做？</li><li>如果再玩一次，你想換哪個號碼？為什麼？</li></ul>';
const SIG='<div class="sig">本遊戲由Peiching開發，角色與情境均為虛構</div>';
function cardFor(s){const L=LEVELS[Math.min(s.level,LEVELS.length-1)];
  switch(s.phase){
    case 'lobby':{const miss=Array.from({length:s.players},(_,i)=>i+1).filter(i=>!s.seats[i].taken);
      return {html:'<div class="eyebrow">等大家到齊</div><h2>一起歪一點</h2><p>每個人用自己的裝置選一個號碼。選了就不能再換，也不能替別人按。</p>'+(miss.length?'<p>還沒有人選：'+miss.map(i=>PL[i].icon+' '+PL[i].name).join('、')+'</p>':'<p>都到齊了，可以開始。</p>'),buttons:miss.length?[]:[['start','開始第一關','dark']]};}
    case 'card':return {html:'<div class="eyebrow">第 '+(s.level+1)+' 關 / 共 '+LEVELS.length+' 關</div><h2>'+L.name+'</h2><p>'+L.tip+'</p>',buttons:[['go','出發','dark']]};
    case 'paused':return {html:'<h2>暫停</h2><p>趁現在討論一下：下一步誰先按？要按多久？</p>',buttons:[['resume','繼續','dark'],['redo','這關重來','']]};
    case 'clear':return {html:'<div class="eyebrow">第 '+(s.level+1)+' 關過關</div><h2>彈珠到家了</h2><p>用了 '+s.lvStat.time+' 秒，掉下去 '+s.lvStat.falls+' 次，兩邊拔河 '+s.lvStat.tugs+' 次。</p><div class="talk">'+talkOf(s.level,s.lvStat)+'</div><p class="sig">先花半分鐘聊一下再按下一關。</p>',buttons:[['next','下一關','dark']]};
    case 'endA':{const used=TOTAL+s.retries*EXTRA-s.timeLeft;return {html:'<div class="eyebrow">結局</div><h2>五顆彈珠都回家了</h2><p>全部用了 '+Math.floor(used/60)+' 分 '+(used%60)+' 秒，一共掉下去 '+s.fallTotal+' 次。</p>'+statTable(s)+'<div class="eyebrow">每個人按住按鈕的時間</div>'+holdBars(s)+feedback(s)+'<div class="eyebrow">小組回顧</div>'+DISCUSS+SIG,buttons:[['again','回到等候區再玩一次','']]};}
    case 'endB':return {html:'<div class="eyebrow">結局</div><h2>天黑了</h2><p>時間到，彈珠停在第 '+(s.level+1)+' 關「'+L.name+'」。</p>'+statTable(s)+'<div class="eyebrow">每個人按住按鈕的時間</div>'+holdBars(s)+'<div class="talk">卡最久的是哪一段？是方向不清楚、速度太快，還是大家同時在講話？先聊一分鐘再決定要不要再試。</div>'+SIG,buttons:[['retry','從這一關再試（多 4 分鐘）','dark'],['again','回到等候區','']]};}

function mmss(t){t=Math.max(0,t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function phaseText(s){return {lobby:'等候中',card:'關卡說明',play:'進行中',paused:'暫停',clear:'過關討論',endA:'完成',endB:'時間到'}[s.phase]||s.phase;}
function seatChips(s,rel){return Array.from({length:s.players},(_,i)=>i+1).map(i=>{const st=s.seats[i];return '<span class="chip'+(st.taken?'':' off')+'"><span class="dotc" style="background:'+PL[i].hex+'"></span>'+PL[i].icon+' '+PL[i].name+' '+(st.taken?(st.online?'已連線':'斷線中'):'空位')+(rel&&st.taken?' <button class="btn ghost" style="padding:2px 8px;font-size:12px" data-release="'+i+'">釋放</button>':'')+'</span>';}).join(' ');}

/* ================= 老師畫面（主機） ================= */
function teacher(){

      conn.on('error',()=>{});});

      if(t==='unavailable-id'){peerErr='房間主機代碼正被使用（可能另一個分頁也開著老師畫面）。3 秒後重試…';peerState='error';render(true);try{peer.destroy();}catch(_){}setTimeout(connectPeer,3000);return;}
      if(t==='network'||t==='server-error'||t==='socket-error'||t==='socket-closed'){peerState='error';peerErr='連不上連線伺服器，請確認這台電腦有網路。會自動重試。';render(true);try{peer.destroy();}catch(_){}setTimeout(connectPeer,Math.min(10000,2000*(++retry)));return;}

  document.body.className='student';
  let token='';try{token=localStorage.getItem('tilt_token')||'';}catch(_){}
  if(!token){token=rid(16,'abcdefghijklmnopqrstuvwxyz0123456789');try{localStorage.setItem('tilt_token',token);}catch(_){}}
  let s=null,me=0,gone=false,err='',state='connecting',conn=null,peer=null,msgId=0;const waiters={};
  function send(o){return new Promise(ok=>{if(!conn||!conn.open){ok({error:'還沒連上老師電腦'});return;}o.id=++msgId;o.room=code;waiters[o.id]=ok;try{conn.send(o);}catch(_){ok({error:'傳送失敗'});}setTimeout(()=>{if(waiters[o.id]){delete waiters[o.id];ok({});}},3000);});}
  function sendNoWait(o){if(conn&&conn.open){o.room=code;try{conn.send(o);}catch(_){}}}
  const holds={};
  function press(d,on){if(on){if(holds[d])return;sendNoWait({t:'press',dir:d,on:true});holds[d]=setInterval(()=>sendNoWait({t:'press',dir:d,on:true}),300);}
    else{if(!holds[d])return;clearInterval(holds[d]);holds[d]=0;sendNoWait({t:'press',dir:d,on:false});}update();}
  function releaseAll(){Object.keys(holds).forEach(d=>press(d,false));}
  window.addEventListener('blur',releaseAll);document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseAll();});
  let retryT=0;
  function connect(){
    state='connecting';render();
    if(!peer||peer.destroyed){peer=new Peer(peerOptions());
      peer.on('error',e=>{const t=e&&e.type;if(t==='peer-unavailable'){state='nohost';render();clearTimeout(retryT);retryT=setTimeout(connect,4000);}
        else if(t==='network'||t==='server-error'||t==='socket-error'||t==='socket-closed'){state='nonet';render();try{peer.destroy();}catch(_){}clearTimeout(retryT);retryT=setTimeout(connect,4000);}});
      peer.on('disconnected',()=>{try{peer.reconnect();}catch(_){}});}
    const go=()=>{conn=peer.connect(hostId,{reliable:true,serialization:'json',metadata:{token}});
      conn.on('open',()=>{state='ok';send({t:'hello'}).then(j=>{if(j.gone){gone=true;render();}});});
      conn.on('data',d=>{if(d.re&&waiters[d.re]){waiters[d.re](d);delete waiters[d.re];}if(d.gone){gone=true;render();return;}if(d.s){s=d.s;me=d.me;render();}});
      conn.on('close',()=>{state='connecting';releaseAll();render();clearTimeout(retryT);retryT=setTimeout(connect,2000);});};
    if(peer.open)go();else peer.once('open',go);
  }
  let shellKey='',cardKey='';
  connect();
  setInterval(()=>sendNoWait({t:'ping'}),2000);
  function render(){
    if(gone){app.innerHTML='<div class="wrap"><div class="card"><h2>房間 '+esc(code)+' 已經關閉</h2><p>請看投影幕上的 QR code 重新掃一次。</p></div></div>';shellKey='';return;}
    if(!s||state!=='ok'){const msg={connecting:'正在連到老師電腦…',nohost:'找不到老師的房間。請確認老師畫面還開著，會自動重試。',nonet:'這台裝置連不上網路，請檢查 Wi-Fi，會自動重試。',ok:'正在進入房間…'}[state];
      if(!s){app.innerHTML='<div class="wrap"><div class="card"><h2>一起歪一點</h2><p>'+msg+'</p><p class="sig">房間 '+esc(code)+'</p></div></div>';shellKey='';return;}
      flash(msg);}
    const key=s.phase+'|'+me+'|'+s.players+'|'+(me?'':JSON.stringify(s.seats))+'|'+err;
    if(key!==shellKey){shellKey=key;cardKey='';app.innerHTML=shell();bindHolds();}
    update();
  }
  function shell(){
    if(!me)return '<div class="wrap"><div class="row" style="justify-content:space-between;margin-bottom:12px"><h2>一起歪一點</h2><span class="chip">房間 '+code+'</span></div>'+
      '<p>選一個號碼。<b>一台裝置只能選一個，選了就不能換。</b></p><div class="pads">'+
      Array.from({length:s.players},(_,i)=>i+1).map(i=>'<button class="seatbtn" data-seat="'+i+'"'+(s.seats[i].taken?' disabled':'')+'><span class="big">'+PL[i].icon+'</span><span>'+PL[i].name+'<br><small style="font-weight:500">管 '+seatText(s.players,i)+'</small></span><span style="margin-left:auto">'+(s.seats[i].taken?'🔒 已有人':'選這個')+'</span></button>').join('')+
      '</div>'+(err?'<p style="color:var(--warn)">'+esc(err)+'</p>':'')+'<p class="sig" style="margin-top:16px">本遊戲由Peiching開發，角色與情境均為虛構</p></div>';
    const p=PL[me],ds=dirsOf(s.players,me);
    return '<div class="wrap"><div class="row" style="justify-content:space-between"><div class="me"><span class="chip" style="background:'+p.hex+';color:#fff">'+p.icon+' '+p.name+'</span>管 '+seatText(s.players,me)+'</div><span class="chip">房間 '+code+'</span></div>'+
      '<div class="status" style="margin-top:8px"><span id="sLevel"></span><span id="sTime"></span></div><div class="mini" style="margin-top:8px"><canvas class="board" id="mini"></canvas></div><div id="sCard" style="margin-top:12px"></div>'+
      '<div class="pads" id="pads"'+(s.phase==='play'?'':' hidden')+' style="grid-template-columns:repeat('+ds.length+',1fr)">'+ds.map(d=>'<button class="hold" data-hold="'+d+'" style="--c:'+p.hex+'"><span>'+ARROW[d]+' '+DNAME[d]+'</span><small>按住不放</small><span class="sta"><i></i></span></button>').join('')+'</div>'+
      '<p class="hint" style="margin-top:12px">只有你能按這'+(ds.length>1?'兩':'一')+'個按鈕，別人的按鈕在別人手上。看投影幕上的木盤，和組員說好再按。'+(ds.length>1?'':'用電腦的話可以按住空白鍵。')+'</p></div>';
  }
  function update(){if(!me||!s)return;
    $('#sLevel').textContent='第 '+(s.level+1)+' 關・'+phaseText(s);$('#sTime').textContent='剩 '+mmss(s.timeLeft);drawBoard($('#mini'),s);
    const c=cardFor(s);const ck=s.phase+s.level+(c?c.html:'');
    if(ck!==cardKey){cardKey=ck;$('#sCard').innerHTML=c?'<div class="card">'+c.html+'<div class="row">'+c.buttons.map(b=>'<button class="btn '+b[2]+'" data-act="'+b[0]+'">'+b[1]+'</button>').join('')+'</div></div>':'';}
    document.querySelectorAll('[data-hold]').forEach(b=>{const d=b.dataset.hold;b.classList.toggle('on',!!(s.act[d]||holds[d]));b.classList.toggle('tired',!!s.tired[d]);b.querySelector('.sta i').style.width=s.sta[d]+'%';});
    if(s.phase!=='play')releaseAll();showToast(s.toast);}
  app.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t)return;
    if(t.dataset.seat){const j=await send({t:'join',seat:+t.dataset.seat});err=j.error||'';shellKey='';render();}
    if(t.dataset.act){const j=await send({t:'act',action:t.dataset.act});if(j.error)flash(j.error);}});
  function bindHolds(){document.querySelectorAll('[data-hold]').forEach(b=>{const d=b.dataset.hold;
    const tOn=e=>{e.preventDefault();press(d,true);},tOff=e=>{e.preventDefault();if(!e.targetTouches||e.targetTouches.length===0)press(d,false);};
    b.addEventListener('touchstart',tOn,{passive:false});b.addEventListener('touchend',tOff,{passive:false});b.addEventListener('touchcancel',tOff,{passive:false});b.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
    b.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;e.preventDefault();try{b.setPointerCapture(e.pointerId);}catch(_){}press(d,true);});
    const up=e=>{if(e.pointerType==='touch')return;press(d,false);};b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);b.addEventListener('contextmenu',e=>e.preventDefault());});}
  window.addEventListener('keydown',e=>{if(e.code==='Space'&&me&&s&&s.phase==='play'){const ds=dirsOf(s.players,me);if(ds.length===1){e.preventDefault();press(ds[0],true);}}});
  window.addEventListener('keyup',e=>{if(e.code==='Space'&&me&&s){const ds=dirsOf(s.players,me);if(ds.length===1)press(ds[0],false);}});
  document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('selectstart',e=>e.preventDefault());
  window.addEventListener('resize',update);
  window.__S={get s(){return s;},get me(){return me;},press,send,get state(){return state;}};
}

/* ================= 進入點 ================= */
let started=false;
window.startApp=function(){
  if(started||LIBS_OK<2)return;
  if(LIBS_OK>=100||typeof Peer==='undefined'){app.innerHTML='<div class="wrap"><div class="card"><h2>連線元件載入失敗</h2><p>這台裝置可能沒有連上網路，或學校網路擋住了 unpkg.com 和 cdn.jsdelivr.net。請確認網路後重新整理。</p></div></div>';return;}
  started=true;
  const h=Q.get('h'),r=Q.get('r');
  if(h&&r&&/^tilt-[a-z0-9]{10}$/.test(h)&&/^[A-Z]{4}$/i.test(r))student(h,r.toUpperCase());else teacher();
};
window.startApp();
})();
</script>
